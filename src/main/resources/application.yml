server:
  port: 4000

spring:
  application:
    name: funding-graphql
  datasource:
    # Defaults target the Postgres published on localhost:5432 (running the jar on your Mac).
    # Inside Docker, docker-compose overrides DB_HOST to the Postgres container name.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auto_funding_db}
    username: ${DB_USER:funder_admin}
    password: ${DB_PASSWORD:funder_dev_password}
  graphql:
    graphiql:
      enabled: true      # UI at http://localhost:4000/graphiql
    schema:
      printer:
        enabled: true    # SDL at http://localhost:4000/graphql/schema

management:
  endpoints:
    web:
      exposure:
        include: health
